paths:
  raw_dir: "clean" # relativo a DATASET_ROOT
  split_output_dir: "splits/seed_42" # relativo a PROJECT_DATA_ROOT (data/ por defecto)

dataset:
  target_size: [224, 224]
  seed: 42
  classes:
    - common_rust
    - fall_armyworm
    - gray_leaf_spot
    - healthy
    - lethal_necrosis
    - nitrogen_deficiency
    - northern_corn_leaf_blight
    - phosphorus_deficiency
    - potassium_deficiency

augmentation:
  minority_ratio_threshold: 4.0

# Perfil histórico activo. baseline_roi se habilitará explícitamente en futuros flujos.
processing_profile: baseline_full

leaf_detection:
  enabled: false
  mode: bbox
  confidence_threshold: 0.50
  min_area_ratio: 0.15
  margin_ratio: 0.08
  selection_strategy: largest_centered
  fallback: original
  preserve_aspect_ratio: true
  padding_value: 0
  save_debug_images: false
  cache_detections: true

baseline:
  classes:
    - common_rust
    - fall_armyworm
    - gray_leaf_spot
    - healthy
    - lethal_necrosis
    - nitrogen_deficiency
    - northern_corn_leaf_blight
    - phosphorus_deficiency
    - potassium_deficiency
  max_images_per_class: 1500
  seed: 42

lime:
  images_per_class: 2
  num_samples: 1000
  num_features: 5
  seed: 42
  baseline: true
  report_sample_size: 30

gradcam:
  enabled: true
