paths:
  raw_dir: "clean"                    # relativo a DATASET_ROOT
  split_output_dir: "splits/seed_42"  # relativo a outputs/

dataset:
  target_size: [224, 224]
  seed: 42
  classes:
    - common_rust
    - fall_armyworm
    - gray_leaf_spot
    - healthy
    - lethal_necrosis
    - nitrogen_deficiency
    - northern_corn_leaf_blight
    - phosphorus_deficiency
    - potassium_deficiency

augmentation:
  minority_ratio_threshold: 4.0

baseline:
  # Cubre las 9 clases del dataset final, en el mismo orden canónico que dataset.classes para
  # que el mapeo clase->índice coincida con el head entrenado. El baseline ahora es "pauta del
  # final": mismas clases y desbalance natural, solo con cap de cabeza para ahorrar cómputo.
  classes:
    - common_rust
    - fall_armyworm
    - gray_leaf_spot
    - healthy
    - lethal_necrosis
    - nitrogen_deficiency
    - northern_corn_leaf_blight
    - phosphorus_deficiency
    - potassium_deficiency
  # "Cap la cabeza, conserva la cola": limita solo las clases por encima del cap (healthy, los
  # tizones, fall_armyworm) y deja intactas las minoritarias (potassium 266, nitrogen 523,
  # phosphorus 612). Overridable con MAX_PER_CLASS / --max-per-class.
  max_images_per_class: 1500
  seed: 42

lime:
  images_per_class: 2
  num_samples: 1000
  num_features: 5
  seed: 42
  baseline: true
  report_sample_size: 30

gradcam:
  enabled: true
