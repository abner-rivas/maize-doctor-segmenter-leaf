paths:
  raw_dir: "clean" # relativo a DATASET_ROOT
  split_output_dir: "splits/seed_42" # relativo a PROJECT_DATA_ROOT (data/ por defecto)

dataset:
  target_size: [224, 224]
  seed: 42
  classes:
    - common_rust
    - fall_armyworm
    - gray_leaf_spot
    - healthy
    - lethal_necrosis
    - nitrogen_deficiency
    - northern_corn_leaf_blight
    - phosphorus_deficiency
    - potassium_deficiency

augmentation:
  minority_ratio_threshold: 4.0

# Perfil histórico activo. baseline_roi se habilitará explícitamente en futuros flujos.
processing_profile: baseline_full

leaf_detection:
  enabled: false
  mode: bbox
  confidence_threshold: 0.50
  min_area_ratio: 0.15
  margin_ratio: 0.08
  selection_strategy: largest_centered
  fallback: original
  preserve_aspect_ratio: true
  padding_value: 0
  save_debug_images: false
  cache_detections: true
  dual_perspective:
    enabled: false
    segmented_profile: "mask_black"
    # Experimental only: a multi-instance selection must also clear the score margin below.
    reject_multiple_eligible: false
    quality_gate:
      # Preserves the observed valid near-full mask (0.9976) but rejects effectively-full leaks.
      max_mask_area_ratio: 0.999
      # A large, sparse and high-perimeter mask must satisfy all three conditions to be rejected.
      large_mask_area_ratio: 0.50
      min_large_mask_bbox_ratio: 0.70
      max_large_mask_normalized_perimeter: 8.0
      # Audit v1: min GOOD multi-leaf margin=0.369; max BAD/AMBIGUOUS=0.302.
      min_multi_instance_score_margin: 0.33
  segmentation:
    checkpoint: "leaf_detection/models/doctor_maiz_leaf_segmenter_best.pt"
    model: "yolo26n-seg"
    ultralytics_version: "8.4.104"
    image_size: 640
    iou_threshold: 0.70
    max_detections: 20
    min_mask_area_ratio: 0.01
    near_full_warning_ratio: 0.98
    background_value: [0, 0, 0]
    selection_weights:
      area: 0.45
      center: 0.35
      confidence: 0.20
    processing_profile: "mask_black"
    fallback: "original"

baseline:
  classes:
    - common_rust
    - fall_armyworm
    - gray_leaf_spot
    - healthy
    - lethal_necrosis
    - nitrogen_deficiency
    - northern_corn_leaf_blight
    - phosphorus_deficiency
    - potassium_deficiency
  max_images_per_class: 1500
  seed: 42

lime:
  images_per_class: 2
  num_samples: 1000
  num_features: 5
  seed: 42
  baseline: true
  report_sample_size: 30

gradcam:
  enabled: true
