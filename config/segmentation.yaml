paths:
  # Retained pilot/reliability manifests may reference the original image corpus.
  raw_dir: "clean"

segmentation:
  model: "yolo26n-seg"
  checkpoint: "leaf_detection/models/doctor_maiz_leaf_segmenter_best.pt"
  ultralytics_version: "8.4.104"
  image_size: 640
  confidence_threshold: 0.50
  iou_threshold: 0.70
  max_detections: 20
  output_profile: "mask_black"
  min_mask_area_ratio: 0.01
  near_full_warning_ratio: 0.98
  background_value: [0, 0, 0]
  selection_weights:
    area: 0.45
    center: 0.35
    confidence: 0.20
  fallback: "original"
  quality_gate:
    reject_multiple_eligible: false
    max_mask_area_ratio: 0.999
    large_mask_area_ratio: 0.50
    min_large_mask_bbox_ratio: 0.70
    max_large_mask_normalized_perimeter: 8.0
    min_multi_instance_score_margin: 0.33
